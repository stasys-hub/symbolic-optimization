[project]
name = "symbolic-optimization"
version = "0.1.0"
description = "Comparison of search strategies on the AI4I 2020 predictive maintenance dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pydantic-ai>=2.36.0",
    "pysr>=2.1.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
